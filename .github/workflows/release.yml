name: Release public wrappers

on:
  push:
    tags: ['v*']

concurrency:
  group: seatlayer-public-wrapper-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: pnpm verify
      - name: Publish React, Vue, and Angular wrappers with provenance
        run: pnpm publish:packages
        env:
          RELEASE_PUBLISH_CONFIRMED: '1'
